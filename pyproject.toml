[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pybspcov"
version = "0.1.0.dev0"
description = "JAX-accelerated Bayesian sparse covariance estimation"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
authors = [{ name = "Kyeongwon Lee", email = "kwlee1718@gmail.com" }]
keywords = ["bayesian", "covariance", "jax", "mcmc", "sparse"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["jax>=0.11.0,<0.12"]

[project.urls]
Documentation = "https://github.com/kw-lee/pybspcov/tree/main/docs"
Issues = "https://github.com/kw-lee/pybspcov/issues"
Repository = "https://github.com/kw-lee/pybspcov"

[project.optional-dependencies]
analysis = ["arviz[matplotlib]>=1.2,<2"]
cuda12 = ["jax[cuda12]>=0.11.0,<0.12"]

[dependency-groups]
benchmark = ["matplotlib>=3.10,<4"]
dev = [
  "arviz[matplotlib]>=1.2,<2",
  "build>=1.3",
  "mypy>=1.17",
  "pre-commit>=4.3",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "twine>=6.1",
]
docs = [
  "furo>=2025.7",
  "myst-parser>=4.0",
  "sphinx>=8.2,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pybspcov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pybspcov"]
mypy_path = "src"
